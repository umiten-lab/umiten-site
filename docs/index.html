<style>
:root{--bg:#06122A;--panel:#0B1D3A;--line:rgba(233,241,250,.14);--text:#E9F1FA;--sub:#A9BBD1;--sun:#F2B544;--sea:#3B8FE0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{position:relative;max-width:1120px;margin:0 auto;padding:0 24px}
.hero{position:relative;overflow:hidden}
.hero>img{position:absolute;right:0;top:0;height:100%;width:70%;object-fit:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 55%),linear-gradient(to bottom,#000 70%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 55%),linear-gradient(to bottom,#000 70%,transparent);mask-composite:intersect}
.top{display:flex;align-items:center;padding-top:16px}
.logo{height:64px;width:auto;display:block}
.brand{font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px}
.top small{color:var(--sub);font-size:13px}
button{font:inherit;color:var(--text);background:rgba(6,18,42,.6);border:1px solid var(--line);border-radius:999px;padding:7px 20px;cursor:pointer}
button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#06122A;font-weight:700}
button:focus-visible,a:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 4px}
.now{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:28px;align-items:center;padding:12px 0 44px}
.lead{margin:0;color:#DCE6F1;text-shadow:0 1px 10px #000}
.big{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.size{margin:0;font-family:'Shippori Mincho',serif;font-weight:800;color:var(--sun);font-size:clamp(64px,12vw,132px);line-height:1.05;text-shadow:0 2px 28px rgba(0,0,0,.55)}
.face{font-size:22px;font-weight:700;border:2px solid var(--sea);border-radius:12px;padding:0 14px;background:rgba(6,18,42,.6)}
dl{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px 20px;margin-top:10px;max-width:560px}
.stats dt{font-size:12px;color:var(--sub)}
.stats dd{margin:0;font-size:19px;font-weight:500}
.kind{display:inline-block;padding:0 8px;border-radius:6px;border:1px solid var(--line);margin-left:6px;font-size:12px;vertical-align:middle}
.kind.off{background:rgba(59,143,224,.3);border-color:var(--sea)}
.kind.on{border-color:var(--sun);color:var(--sun)}
.compass{background:rgba(6,18,42,.72);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:4px 6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
h2{font-size:18px;margin:34px 0 12px}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.day{border-radius:14px;text-align:left;padding:10px 14px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.day[aria-pressed="true"]{background:var(--sun)}
.day b{font-family:'Shippori Mincho',serif;font-size:20px;line-height:1.3}
.day span{font-size:12px}
.spark{height:26px;width:100%;margin:2px 0}
.panel{background:var(--panel);border-radius:18px;padding:18px 14px 14px;overflow-x:auto}
.chart{min-width:760px}
svg{display:block;width:100%;height:auto}
.grid{display:grid;grid-template-columns:5.512% repeat(24,1fr);margin-top:6px}
.cl{font-size:12px;color:var(--sub);display:flex;align-items:center;height:34px}
.c{height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.05;border:1px solid var(--bg)}
.c i{font-style:normal;display:block;font-size:14px}
.night{opacity:.5}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 16px;background:var(--panel)}
.links a:hover{border-color:var(--sun)}
.msg{padding:40px 0;color:var(--sub)}
.n{font-size:12px;color:var(--sub);font-weight:400;margin-left:12px}
.note{font-size:12px;color:var(--sub);margin:6px 6px 0}
.tbw{overflow-x:auto}.tb{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}.tb th{color:var(--sub);font-weight:400;padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}.tb td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}.tb small{color:var(--sub);margin-left:4px}.tb tr.nt td{color:var(--sub);background:rgba(169,187,209,.08)}
footer{max-width:1120px;margin:0 auto;padding:32px 24px 48px;color:var(--sub);font-size:12px}
@media (max-width:760px){.now{grid-template-columns:1fr}.hero>img{width:100%;opacity:.5}}

/* Small-screen refinements: keep wave tables scrollable instead of crushing data. */
.size{font-size:clamp(36px,4.6vw,58px);line-height:1.22;letter-spacing:-.025em;overflow-wrap:anywhere}
.panel,.tbw{min-width:0;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
img{max-width:100%}
.scroll-hint{display:none}
@media (max-width:760px){
  .wrap{padding-left:16px;padding-right:16px;min-width:0}
  .hero>img{width:100%;opacity:.24;object-position:center;pointer-events:none}
  .top{padding-top:12px}
  .top .logo{height:auto;width:min(192px,64vw);max-height:90px;object-fit:contain}
  .tabs{gap:8px;padding-top:10px}
  .tabs button{min-height:44px;max-width:100%;white-space:normal;padding:9px 15px;line-height:1.4}

/* UMITEN forecast rating: symbols supplement colors for instant scanning. */
.score-level--excellent{--rating:#66e2bb;--rating-bg:rgba(64,194,153,.17)}
.score-level--good{--rating:#83d5ff;--rating-bg:rgba(79,159,224,.16)}
.score-level--fair{--rating:#ffd26c;--rating-bg:rgba(242,181,68,.17)}
.score-level--weak{--rating:#ffae7c;--rating-bg:rgba(242,139,82,.17)}
.score-level--poor{--rating:#ff91a0;--rating-bg:rgba(232,90,120,.18)}
.score-level--unknown{--rating:#b3c4d9;--rating-bg:rgba(169,187,209,.12)}
.score-summary{margin-top:12px;display:inline-flex;align-items:center;gap:10px;padding:10px 14px;
  min-width:182px;max-width:100%;border:1px solid color-mix(in srgb,var(--rating) 50%,transparent);
  border-radius:14px;background:var(--rating-bg)}
.score-summary .score-symbol{font-size:37px;font-weight:750;line-height:1;color:var(--rating);min-width:37px;text-align:center}
.score-copy{display:flex;flex-direction:column;line-height:1.35;gap:2px}
.score-copy .score-kicker{font-size:11px;color:var(--sub)}
.score-copy strong{font-size:16px;color:var(--text);font-weight:700}
.score-copy .score-num{font-size:12px;color:var(--rating);font-weight:700}
.score-mini{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:4px;
  border:1px solid color-mix(in srgb,var(--rating) 40%,transparent);background:var(--rating-bg);
  padding:2px 8px;border-radius:999px;color:var(--rating);font-size:12px;line-height:1.25;font-weight:700}
.score-mini .score-symbol{font-size:20px;line-height:1}
.day[aria-pressed="true"] .score-mini{background:rgba(6,18,42,.12);border-color:rgba(6,18,42,.2);color:#06122a}
.score-hour,.score-table{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;gap:1px;color:var(--rating)}
.score-hour .score-symbol,.score-table .score-symbol{font-size:17px;line-height:1;font-weight:800}
.score-hour .score-num{font-size:10px;font-weight:700}
.score-table .score-symbol{font-size:21px}
.score-table .score-num{font-size:12px}
.rating-guide{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0 14px;align-items:center}
.rating-guide-title{font-size:12px;color:var(--sub)}
.rating-key{display:inline-flex;gap:4px;align-items:center;font-size:12px;white-space:nowrap}
.rating-key .rating-mark{font-size:18px;font-weight:800;line-height:1;color:var(--rating)}
.rating-key .rating-range{color:var(--sub);font-size:11px}
.rating-explain{margin:0 0 10px;color:var(--sub);font-size:11px}
@media (max-width:760px){
  .score-summary{padding:9px 12px;margin-top:8px}

/* 茨城弁の長めの評価コメントをスマホでも収める */
.score-summary{width:fit-content;align-items:center}

 .score-summary{max-width:100%;min-width:0}

/* The date is explicit on each independently scrollable forecast section. */
.series-heading{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px 14px}

/* 海の一日：朝、昼、夕、夜。ナイトは旧ダークテーマと同じ配色。 */
:root,[data-theme="night"]{color-scheme:dark;--control-bg:rgba(6,18,42,.68);--compass-bg:rgba(6,18,42,.72);--hero-opacity:.24;--selected-text:#06122A}
[data-theme="daylight"]{color-scheme:light;--bg:#EAF5FC;--panel:#FFFFFF;--line:rgba(28,86,130,.20);--text:#15334F;--sub:#466982;--sun:#126A9E;--sea:#1387C5;--control-bg:rgba(255,255,255,.94);--compass-bg:#F7FCFF;--hero-opacity:.11;--selected-text:#FFFFFF}
[data-theme="daylight"] body{background:linear-gradient(180deg,#D7F0FF 0,#EAF5FC 500px,#EAF5FC 100%)}
[data-theme="daylight"] .hero{background:linear-gradient(120deg,#EAF9FF 0%,#C9EBFC 60%,#AEE0F9 100%)}

[data-theme="sunrise"] body{background:linear-gradient(180deg,#FFDFBF 0,#FFF1E5 480px,#FFF1E5 100%)}
[data-theme="sunrise"] .hero{background:linear-gradient(125deg,#FFEDD6 0%,#FFE0C0 56%,#FFC5A3 100%)}
[data-theme="sunrise"] .hero>img{opacity:.14;mix-blend-mode:multiply}

[data-theme="sunrise"] .size{text-shadow:none}
[data-theme="sunrise"] .face{background:rgba(255,249,239,.92)}
[data-theme="sunrise"] .day[aria-pressed="true"], [data-theme="sunrise"] .tabs button[aria-pressed="true"]{color:#FFFFFF;background:#A94524;border-color:#A94524}

[data-theme="sunrise"] svg text[fill="#E9F1FA"]{fill:#392C33!important}
[data-theme="sunrise"] .score-level--excellent{--rating:#147457;--rating-bg:rgba(22,135,96,.11)}
[data-theme="sunrise"] .score-level--good{--rating:#155F8E;--rating-bg:rgba(21,111,154,.10)}
[data-theme="sunrise"] .score-level--fair{--rating:#915715;--rating-bg:rgba(186,112,23,.10)}
[data-theme="sunrise"] .score-level--weak{--rating:#A44722;--rating-bg:rgba(192,79,34,.11)}
[data-theme="sunrise"] .score-level--poor{--rating:#A52D49;--rating-bg:rgba(206,57,79,.10)}
[data-theme="sunrise"] .score-level--unknown{--rating:#695A65;--rating-bg:rgba(105,90,101,.09)}

button{background:var(--control-bg)}
button[aria-pressed="true"],.board-switch .board-buttons button[aria-pressed="true"]{color:var(--selected-text)}
.board-switch .board-buttons{background:var(--control-bg)}

[data-theme="daylight"] .hero>img{opacity:.08}

[data-theme="daylight"] svg text[fill="#A9BBD1"]{fill:#456073!important}

.theme-picker{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-left:auto}

.chart{min-width:1016px}

  position:sticky;left:0;z-index:5;

}

// サーファーの呼び方。沖の波高から±15%の幅で表示(例: モモ〜コシ)
function sz(a){
  if(a == null) return '--'; if(a < 0.15) return 'フラット';
  const f = x => { for(const [n,lo,hi] of BANDS) if(x < hi) return n; return 'オーバーヘッド'; };
  const lo = f(a*0.85), hi = f(a*1.15); return lo === hi ? lo : lo + '〜' + hi;
}

// 総合評価: 予測スコア (0–100) から5段階へ。境界値は暫定値。
const RATING_LEVELS = [
  {min:85, mark:'◎', label:'最高', key:'excellent', range:'85〜100点'},
  {min:70, mark:'○', label:'良好', key:'good', range:'70〜84点'},
  {min:55, mark:'△', label:'まずまず', key:'fair', range:'55〜69点'},
  {min:40, mark:'▼', label:'今ひとつ', key:'weak', range:'40〜54点'},
  {min:0, mark:'×', label:'厳しい', key:'poor', range:'0〜39点'}
];
function rating(score){
  if(score == null || !Number.isFinite(Number(score))) return {mark:'—',label:'データなし',key:'unknown',range:''};
  const v = Math.min(100, Math.max(0, Number(score)));
  return RATING_LEVELS.find(x => v >= x.min);
}
function scoreBadge(score, display, advice){

function isSafeDaylightHour(r, p=POINTS[state.pi]){
  if(!p || !Number.isFinite(Number(p.lat)) || !Number.isFinite(Number(p.lon))) return false;
  const [rise, set] = sun(r.t.slice(0,10), Number(p.lat), Number(p.lon));

// 今日の残り時間についてだけ判断する。明日や日没後の高得点は勧めない。
// 総合評価の記号と点数は別に常時表示する。
function adviceFor(current, rows, now){
  const today = now.slice(0,10);
  const upcoming = rows.filter(r => r.t.slice(0,10) === today &&
    r.t >= now && isSafeDaylightHour(r) && boardScore(r) != null);
  if(!upcoming.length) return '今日はもうやめとくべ。また次だな。';
  const best = bestOf(upcoming), bestScore = boardScore(best);
  if(bestScore < 40) return '日没まで厳しそうだな。今日はやめとくべ。';
  if(bestScore < 55) return 'ちっとはできっかもしんねえけど、無理しねえ方がいいな。';

  const currentEligible = current && current.t.slice(0,10) === today &&
    current.t >= now && isSafeDaylightHour(current);
  const currentScore = currentEligible ? boardScore(current) : null;
  const bestHour = hourOf(best.t) + '時ごろ';
  // △以上なら良い時間帯。現時点で十分良ければ無理に「待て」とは言わない。
  if(currentScore != null && currentScore >= 55 &&
     (best === current || bestScore < currentScore + 9)) {
    return currentScore >= 70 ? '今が狙い目だな。海さ行ぐべ！' :
      'まずまずだな。入るなら今でも悪ぐねえ。';
  }
  if(!currentEligible || best.t > current.t){
    return bestHour + 'が良さそうだな。もうちっと待ってみっぺ。';
  }
  return bestScore >= 70 ? '今が狙い目だな。海さ行ぐべ！' :
    '今なら、まずまずできそうだな。';
}
function recommendView(rows, now){
  const best = bestRecommendation(rows, now);
  if(!best){
    const ref = dailyRatingRow(rows);
    const possible = rows.some(r => r.t >= now && isSafeDaylightHour(r));
    const note = possible ? '今後の明るい時間帯に55点以上の予報がありません' : '今後、入水に適した明るい時間帯がありません';
    const label = ref && !isSafeDaylightHour(ref) ? '当日の参考評価（夜間など）' : '当日の日中最高評価';
    return '<div class="recommendation"><span class="tag">おすすめの時間帯</span><b>該当なし</b>' +
      '<span>' + note + '</span><span class="rec-reference">' +
      (ref ? label + ' ' + scoreBadge(boardScore(ref),'day') : '総合評価 ' + scoreBadge(null,'day')) +
      '</span></div>';
  }
  const s = boardScore(best), date = dayLabel(best.t.slice(0,10));
  return '<div class="recommendation"><span class="tag">おすすめの時間帯（総合点と連動）</span><b>' + date + ' ' + hourOf(best.t) + ':00〜' + (hourOf(best.t)+1) + ':00</b>' + scoreBadge(s,'day') + '</div>';

function bestOf(rows){ return rows.reduce((b,r) => (boardScore(r) != null && (b == null || boardScore(r) > boardScore(b))) ? r : b, null); }

// 原則として日中（安全に明るい時間）の最高評価を表示し、夜だけしか
// 値がない場合も「参考」と明示したうえで評価を残す。
function dailyRatingRow(rows){
  const scored = rows.filter(r => boardScore(r) != null);

  const dayHours = scored.filter(r => hourOf(r.t) >= 5 && hourOf(r.t) <= 18);
  return bestOf(daylight.length ? daylight : dayHours.length ? dayHours : scored);
}

function compass(r, p){

  const [x1,y1] = pt(p.facing+90,R), [x2,y2] = pt(p.facing+270,R), [lx,ly] = pt(p.facing+180,44);

    const ux=Math.sin(a), uy=-Math.cos(a), nx=Math.cos(a), ny=Math.sin(a);

    '<path d="M'+x1+' '+y1+'A84 84 0 0 1 '+x2+' '+y2+'Z" fill="rgba(169,187,209,.24)"/>' +

// 日の出・日の入り(JSTの時刻)。NOAAの近似式
function sun(date, lat, lon){

  const ha = Math.acos(Math.cos(90.833*R)/(Math.cos(lat*R)*Math.cos(dc)) - Math.tan(lat*R)*Math.tan(dc))/R;

}
function spark(dt, mx, sel){
  const w = 7, g = 2;
  return '<svg class="spark" viewBox="0 0 ' + (dt.length*(w+g)) + ' 28" preserveAspectRatio="none">' + dt.map((x,i) => { const h = Math.max(1, (x.a || 0)/mx*26); return '<rect x="' + i*(w+g) + '" y="' + (28-h) + '" width="' + w + '" height="' + h + '" rx="1.5" fill="' + (sel ? '#06122A' : ramp(x.a || 0)) + '"/>'; }).join('') + '</svg>';
}

function sourcePanel(p){
  const source=p.sources;
  const at=(g) => g && g.lat != null && g.lon != null ? Number(g.lat).toFixed(4)+'°N, '+Number(g.lon).toFixed(4)+'°E' : '座標未収録';
  const safe=(x) => String(x==null?'—':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rows = !source ? '<tr><td colspan="3">旧形式の予報データです。新しい forecast.py を実行すると、各モデルの参照格子点座標を表示できます。</td></tr>' : [
    ['波浪・水温', source.marine],['海面高度（潮位の参考値）', source.tide],['風向・風速', source.wind],['天気・気温', source.weather]
  ].map(([name,x])=>'<tr><th>'+name+'</th><td>'+safe(x?.provider)+'</td><td>'+safe(at(x?.grid))+'</td></tr>').join('');
  return '<details class="source-panel"><summary>データの出典・参照地点（格子点）</summary>'+
    '<p>対象ポイント設定座標：'+safe(at(source?.query_location||p))+'。下表はAPI応答に含まれる参照格子点の代表座標です。</p>'+
    '<table><thead><tr><th>データ</th><th>提供元・モデル</th><th>参照座標</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p>海岸の代表方位：海側へ'+safe(p.facing == null ? '不明' : p.facing+'°')+'（北を0°として時計回り）。風向評価の設定値であり、砂州などの局所的な向きは反映しません。'+(p.facing_source ? ' <a href="'+safe(p.facing_source)+'" target="_blank" rel="noopener noreferrer">方位の参考資料</a>' : '')+'</p>'+
    '<p>※海面高度はOpen-Meteo Marineのモデル値（平均海面基準）で、港の検潮所の観測潮位ではありません。実際の格子点位置・利用モデルはAPIの応答・選択に依存します。<a href="https://open-meteo.com/en/docs/marine-weather-api" target="_blank" rel="noopener">Marine API</a> / <a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Weather API</a></p></details>';
}


// ウェット指数は 0=軽装向き、100=高い保温性が必要。医療的な体感温度ではない。
// 画像の参考表の気温・水温範囲から、暖かい側80%地点を代表閾値として採用する。
// 1日の予報値には、気温・水温は下位20%、風速は上位80%を使って冷え込みを見逃しにくくする。
const WET_SUIT_TABLE = [
  {name:'ドライスーツ', air:[-5,15], water:[2,15]},
  {name:'セミドライ', air:[3,18], water:[5,18]},
  {name:'フルスーツ', air:[14,20], water:[15,20]},
  {name:'シーガル', air:[17,25], water:[18,24]},
  {name:'ロングスプリング', air:[18,22], water:[20,22]},
  {name:'ロングジョン', air:[23,30], water:[18,26]},
  {name:'スプリング', air:[23,30], water:[18,26]},
  {name:'ショートジョン', air:[23,30], water:[22,28]},
  {name:'タッパー', air:[25,32], water:[22,32]}
];
function wetQuantile(values, fraction){
  const xs=values.filter(v=>v!=null && Number.isFinite(Number(v))).map(Number).sort((a,b)=>a-b);
  if(!xs.length)return null;
  const p=(xs.length-1)*fraction, a=Math.floor(p), b=Math.ceil(p);
  return xs[a]+(xs[b]-xs[a])*(p-a);
}
function wetEffectiveTemp(air, water, wind){
  // 海水への浸漬を強めに重み付け。風の冷却は水温換算で保守的に補正する経験則。
  return water*0.65+air*0.35-0.55*Math.max(0,wind-2);
}
function wetTarget(suit){
  const q80=range=>range[0]+0.8*(range[1]-range[0]);
  return wetEffectiveTemp(q80(suit.air),q80(suit.water),2);
}
function wetsuitFor(rows, date, now){
  const daylight=rows.filter(r=>r.t.slice(0,10)===date && isSafeDaylightHour(r));
  // 今日だけ、現在より後の入水可能時間帯で判定する。
  const future=daylight.filter(r=>r.t>=now);
  const usable=(date===now.slice(0,10) && future.length) ? future : daylight;
  const valid=usable.filter(r=>[r.tmp,r.sst,r.spd].every(v=>v!=null && Number.isFinite(Number(v))));
  if(!valid.length)return {available:false,date:date};
  const air=wetQuantile(valid.map(r=>r.tmp),.2);
  const water=wetQuantile(valid.map(r=>r.sst),.2);
  const wind=wetQuantile(valid.map(r=>r.spd),.8);
  const effective=wetEffectiveTemp(air,water,wind);
  const target=name=>wetTarget(WET_SUIT_TABLE.find(s=>s.name===name));
  // 80パーセンタイル閾値をもとに、薄着へ移るハードルをやや高めに設定。
  let suit;
  if(effective<target('セミドライ')) suit='ドライスーツ';
  else if(effective<target('フルスーツ')) suit='セミドライ';
  else if(effective<22.2) suit='フルスーツ';
  else if(effective<target('スプリング')) suit=wind>=3.5?'ロングスプリング':'シーガル';
  else if(effective<target('ショートジョン')) suit=wind>=3.5?'スプリング':'ロングジョン';
  else if(effective<target('タッパー')) suit='ショートジョン';
  else suit='タッパー';
  const index=Math.max(0,Math.min(100,Math.round(100*(30-effective)/22)));
  const note = date===now.slice(0,10) && !future.length ? '今日は日中の参考値（これからの入水可能時間なし）' :
               date===now.slice(0,10) ? '現在から日没までの予報を使用' : 'その日の日中予報を使用';
  return {available:true,date,air,water,wind,effective,suit,index,note};
}
function wetsuitCard(rows,date,now){
  const x=wetsuitFor(rows,date,now);
  if(!x.available) return '<section class="wetsuit-card" aria-label="ウェット指数"><div class="wetsuit-heading"><span class="wetsuit-symbol">♨</span>ウェット指数</div><p class="wetsuit-note">気温・海水温・風速の予報が不足しているため、判定できません。</p></section>';
  const f=n=>n.toFixed(1);
  return '<section class="wetsuit-card" aria-label="ウェット指数とおすすめウェット">'+
    '<div class="wetsuit-head"><span class="wetsuit-heading"><span class="wetsuit-symbol" aria-hidden="true">♨</span>ウェット指数・おすすめウェット</span><span class="wetsuit-date">'+fullDate(x.date)+'</span></div>'+
    '<div class="wetsuit-main"><div><div class="wetsuit-name">'+x.suit+'</div><p class="wetsuit-small">'+x.note+'</p></div><div class="wetsuit-score"><b>'+x.index+'</b><small>/100</small></div></div>'+
    '<div class="wetsuit-gauge" role="img" aria-label="保温必要度 '+x.index+'点"><span style="width:'+x.index+'%"></span></div>'+
    '<p class="wetsuit-details">気温 '+f(x.air)+'℃ ・ 海水温 '+f(x.water)+'℃ ・ 風速 '+f(x.wind)+'m/s を考慮</p>'+
    '<p class="wetsuit-note">指数が高いほど保温性の高い装備が目安。体感には日差し・運動量・体質・入水時間も影響します。</p></section>';
}

function view(p, rows){
  const now = jstNow(); let ni = rows.findIndex(r => r.t >= now); if(ni < 0) ni = 0;
  NOWT = now;
  const ds = days(rows).filter(d => d.date >= now.slice(0,10));
  if(!ds.length) return '<div class="wrap"><p class="msg">予想データが古くなっています。start.sh で予想を更新してください。</p></div>|SPLIT|';
  const r = rows[ni], di = Math.min(state.day, ds.length - 1); SUN = sun(ds[di].date, p.lat, p.lon);
  const selectedDate = fullDate(ds[di].date);
  const dateMark = '<div class="series-date"><span>対象日</span><b>' + selectedDate + '</b><span class="zone">日本時間（JST）</span></div>';
  const tide = r.tide == null ? '--' : Math.round(r.tide*100) + 'cm ' + (r.tideNext != null && r.tideNext > r.tide ? '上げ' : '下げ');
  const wk = Math.max(0.5, ...rows.filter(x => hourOf(x.t) >= 5 && hourOf(x.t) <= 18).map(x => x.a || 0));
  const week = ds.map((d,i) => { const dt = daytime(d.rows), mx = dt.reduce((m,x) => x.a != null && x.a > m ? x.a : m, 0), b = bestRecommendation(d.rows, now), ref = dailyRatingRow(d.rows), rated = b || ref;
    const status = b ? 'おすすめ ' + hourOf(b.t) + '時・' + boardScore(b) + '点' : 'おすすめ枠なし' + (ref ? '／' + (isSafeDaylightHour(ref) ? '日中最高' : '参考') + ' ' + boardScore(ref) + '点' : '／予報データなし');
    return '<button class="day" data-day="' + i + '" aria-pressed="' + (i === di) + '"><span>' + dayLabel(d.date) + '</span><b>' + sz(mx) + '</b>' + scoreBadge(boardScore(rated), 'day') + expertFlag(mx, 'mini') + spark(dt, wk, i === di) + '<span>' + status + '</span></button>'; }).join('');
  return '<div class="wrap"><section class="now"><div><p class="lead">' + p.name + ' の予報｜' + forecastTime(r.t) + (p.map_url ? ' <a class="spot-map" href="' + p.map_url + '" target="_blank" rel="noopener noreferrer">地図を見る ↗</a>' : '') + '</p><div class="big"><p class="size">' + sz(r.a) + '</p></div>' + scoreBadge(boardScore(r), 'hero', adviceFor(r, rows, now)) + expertFlag(r.a, 'inline') +
    '<dl class="stats"><div><dt>' + statIcon('shore') + '岸の波高</dt><dd>' + fmt(r.a,1) + 'm</dd></div><div><dt>' + statIcon('offshore') + '沖の波高</dt><dd>' + fmt(r.h,1) + 'm</dd></div><div><dt>' + statIcon('period') + '周期</dt><dd>' + fmt(r.per,0) + '秒</dd></div>' +
    '<div><dt>' + statIcon('wind') + '風</dt><dd>' + fmt(r.spd,1) + 'm/s' + (r.kind ? '<span class="kind ' + kindCls(r.kind) + '">' + KIND[r.kind] + '</span>' : '') + '</dd></div><div><dt>' + statIcon('tide') + '潮位</dt><dd>' + tide + '</dd></div><div><dt>' + statIcon('temp') + '水温</dt><dd>' + fmt(r.sst,1) + '℃</dd></div></dl></div>' +
    '<div class="compass">' + compass(r, p) + '</div></section></div>|SPLIT|' +
    '<div class="wrap">' + recommendView(ds[di].rows, now) + wetsuitCard(ds[di].rows, ds[di].date, now) + '<h2>1週間の見通し</h2>' + scoreGuide() + '<div class="week">' + week + '</div>' + '<h2 class="series-heading">波・風の時系列 <span class="date-label">' + selectedDate + '</span><small class="n">「面」の青い帯は水面の良さ（濃いほど良い）</small></h2><div class="panel">' + dateMark + '<p class="scroll-hint">← 表を横にスワイプして時間帯を確認 →</p><div class="series-key"><span>波：岸の波高</span><span>青線：潮位</span><span>下段：風・面・周期・波向・評価</span></div><div class="chart">' + chart(ds[di].rows, now) + cells(ds[di].rows) + '</div></div>' +
    '<h2 class="series-heading">潮位の時系列 <span class="date-label">' + selectedDate + '</span></h2><div class="panel">' + dateMark + '<div class="series-key">潮位の推移（平均海面基準・モデル値）</div>' + tideChart(ds[di].rows, now) + '</div><h2 class="series-heading">時間別の詳細（2時間ごと） <span class="date-label">' + selectedDate + '</span></h2><div class="panel">' + dateMark + table(ds[di].rows) + '</div>' +
    '<h2>天気・実測を見る(気象庁・国土交通省のサイトへ)</h2><div class="links">' + LINKS.map(l => '<a href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + '</a>').join('') + '</div>' + sourcePanel(p) + '</div>';
}

    '<div class="board-switch"><span class="board-label">ボードに合わせた予報</span><div class="board-buttons" role="group" aria-label="ボードの種類">' +
    ['short','long'].map(b => '<button data-board="' + b + '" aria-pressed="' + (state.board === b) + '">' + (b === 'short' ? 'ショート' : 'ロング') + '</button>').join('') +
    '</div></div><div class="theme-picker"><label for="theme-select">表示テーマ</label><select id="theme-select" aria-label="表示テーマ">' +
    [['sunrise','サンライズ'],['daylight','デイライト'],['sunset','サンセット'],['night','ナイト']].map(([v,l]) => '<option value="' + v + '"' + (state.theme===v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>';
  let parts = ['', ''];
  if(state.err) parts[0] = '<div class="wrap"><p class="msg">データを取得できませんでした。<br>' + state.err + '</p></div>';
  else if(!rows) parts[0] = '<div class="wrap"><p class="msg">波のデータを取得中です…</p></div>';
  else parts = view(p, rows).split('|SPLIT|');
  app.innerHTML = '<div class="hero"><img src="' + WAVE + '" alt=""><div class="wrap"><div class="top"><img class="logo" src="' + (UMITEN_LOGOS[state.theme] || UMITEN_LOGOS.night) + '" alt="海点 UMITEN"></div>' + tabs + '</div>' + parts[0] + '</div>' + (parts[1] || '');
  document.getElementById('foot').innerHTML = '波・潮・水温・風のデータ: Open-Meteo.com(CC BY 4.0)。風は気象庁のモデルを優先して使います。岸の波高は、沖の波を屈折・浅水変形で岸に近づけた簡易計算で、評価は試験運用中の参考情報です。安全は現地の海況を確認して判断してください。' + (state.at ? ' 更新 ' + state.at : '') + ((Date.now() - Date.parse(state.gen)) > 12*36e5 ? '(データが古いので、予想を更新してください)' : '');
}
function select(i){ state.pi = i; state.day = 0; render(); }
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.point != null) select(+t.dataset.point);
  else if(t.dataset.day != null){ state.day = +t.dataset.day; render(); }
  else if(t.dataset.board != null){ state.board = t.dataset.board; try{localStorage.setItem('umiten-board',state.board);}catch(_){} render(); }
});
app.addEventListener('change', e => {
  if(e.target.id === 'theme-select'){
    state.theme=e.target.value; document.documentElement.dataset.theme=state.theme;
    try { localStorage.setItem('umiten-theme',state.theme); } catch(_) {}
    render();
  }
});
async function init(){
  try{
    const j = await (await fetch('data/forecast.json', {cache:'no-cache'})).json();
    POINTS = j.points.map(p => ({id:p.id, name:p.name, facing:p.facing, lat:p.lat, lon:p.lon, map_url:p.map_url||null, facing_source:p.facing_source||null, sources:p.sources||null}));
    j.points.forEach(p => state.data[p.id] = p.rows);
    state.at = (j.generated_at || '').slice(11,16); state.gen = j.generated_at || '';
    select(0);
  }catch(e){ POINTS = [{id:'x', name:'—', facing:0}]; state.err = 'forecast.json を読み込めませんでした(' + e.message + ')'; render(); }
}
init();
</script>
</body>
</html>
