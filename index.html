<style>
:root{--bg:#06122A;--panel:#0B1D3A;--line:rgba(233,241,250,.14);--text:#E9F1FA;--sub:#A9BBD1;--sun:#F2B544;--sea:#3B8FE0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{position:relative;max-width:1120px;margin:0 auto;padding:0 24px}
.hero{position:relative;overflow:hidden}
.hero>img{position:absolute;right:0;top:0;height:100%;width:70%;object-fit:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 55%),linear-gradient(to bottom,#000 70%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 55%),linear-gradient(to bottom,#000 70%,transparent);mask-composite:intersect}
.top{display:flex;align-items:center;padding-top:16px}
.logo{height:64px;width:auto;display:block}
.brand{font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px}
.top small{color:var(--sub);font-size:13px}
button{font:inherit;color:var(--text);background:rgba(6,18,42,.6);border:1px solid var(--line);border-radius:999px;padding:7px 20px;cursor:pointer}
button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#06122A;font-weight:700}
button:focus-visible,a:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 4px}
.now{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:28px;align-items:center;padding:12px 0 44px}
.lead{margin:0;color:#DCE6F1;text-shadow:0 1px 10px #000}
.big{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.size{margin:0;font-family:'Shippori Mincho',serif;font-weight:800;color:var(--sun);font-size:clamp(64px,12vw,132px);line-height:1.05;text-shadow:0 2px 28px rgba(0,0,0,.55)}
.face{font-size:22px;font-weight:700;border:2px solid var(--sea);border-radius:12px;padding:0 14px;background:rgba(6,18,42,.6)}
dl{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px 20px;margin-top:10px;max-width:560px}
.stats dt{font-size:12px;color:var(--sub)}
.stats dd{margin:0;font-size:19px;font-weight:500}
.kind{display:inline-block;padding:0 8px;border-radius:6px;border:1px solid var(--line);margin-left:6px;font-size:12px;vertical-align:middle}
.kind.off{background:rgba(59,143,224,.3);border-color:var(--sea)}
.kind.on{border-color:var(--sun);color:var(--sun)}
.compass{background:rgba(6,18,42,.72);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:4px 6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
h2{font-size:18px;margin:34px 0 12px}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.day{border-radius:14px;text-align:left;padding:10px 14px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.day[aria-pressed="true"]{background:var(--sun)}
.day b{font-family:'Shippori Mincho',serif;font-size:20px;line-height:1.3}
.day span{font-size:12px}
.spark{height:26px;width:100%;margin:2px 0}
.panel{background:var(--panel);border-radius:18px;padding:18px 14px 14px;overflow-x:auto}
.chart{min-width:760px}
svg{display:block;width:100%;height:auto}
.grid{display:grid;grid-template-columns:5.512% repeat(24,1fr);margin-top:6px}
.cl{font-size:12px;color:var(--sub);display:flex;align-items:center;height:34px}
.c{height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.05;border:1px solid var(--bg)}
.c i{font-style:normal;display:block;font-size:14px}
.night{opacity:.5}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 16px;background:var(--panel)}
.links a:hover{border-color:var(--sun)}
.msg{padding:40px 0;color:var(--sub)}
.n{font-size:12px;color:var(--sub);font-weight:400;margin-left:12px}
.note{font-size:12px;color:var(--sub);margin:6px 6px 0}
.tbw{overflow-x:auto}.tb{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}.tb th{color:var(--sub);font-weight:400;padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}.tb td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}.tb small{color:var(--sub);margin-left:4px}.tb tr.nt td{color:var(--sub);background:rgba(169,187,209,.08)}
footer{max-width:1120px;margin:0 auto;padding:32px 24px 48px;color:var(--sub);font-size:12px}
@media (max-width:760px){.now{grid-template-columns:1fr}.hero>img{width:100%;opacity:.5}}

/* Small-screen refinements: keep wave tables scrollable instead of crushing data. */
.size{font-size:clamp(36px,4.6vw,58px);line-height:1.22;letter-spacing:-.025em;overflow-wrap:anywhere}
.panel,.tbw{min-width:0;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
img{max-width:100%}
.scroll-hint{display:none}
@media (max-width:760px){
  .wrap{padding-left:16px;padding-right:16px;min-width:0}
  .hero>img{width:100%;opacity:.24;object-position:center;pointer-events:none}
  .top{padding-top:12px}
  .top .logo{height:auto;width:min(192px,64vw);max-height:90px;object-fit:contain}
  .tabs{gap:8px;padding-top:10px}
  .tabs button{min-height:44px;max-width:100%;white-space:normal;padding:9px 15px;line-height:1.4}
  .now{gap:18px;padding-top:12px;padding-bottom:28px;min-width:0}
  .size{font-size:clamp(25px,6.8vw,34px);line-height:1.3;letter-spacing:-.02em;overflow-wrap:anywhere}
  .lead{font-size:14px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .stats dd{font-size:16px;overflow-wrap:anywhere}
  .stats .kind{margin-left:0;margin-top:4px}
  .compass{max-width:420px;width:100%;justify-self:center;padding:12px}
  .compass svg{max-width:285px;margin:0 auto}
  .week{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .day{padding:10px;min-width:0;min-height:90px}
  .day b{font-size:17px;overflow-wrap:anywhere}
  .panel{padding:12px 10px 14px;border-radius:12px}
  .chart{min-width:760px}
  .scroll-hint{display:block;margin:0 0 8px;color:var(--sub);font-size:12px}
  .panel > .scroll-hint{position:sticky;left:0;max-width:calc(100vw - 56px)}
  .n{display:block;margin:5px 0 0;line-height:1.5}
  .links a{min-height:44px;display:flex;align-items:center;padding:10px 14px}
  footer{padding:24px 16px 38px}
}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
  .tabs button{padding:8px 11px;font-size:13px}
  .stats dd{font-size:15px}
  .week{gap:6px}
  .day{padding:9px 8px}
  .day b{font-size:16px}
}

/* UMITEN forecast rating: symbols supplement colors for instant scanning. */
.score-level--excellent{--rating:#66e2bb;--rating-bg:rgba(64,194,153,.17)}
.score-level--good{--rating:#83d5ff;--rating-bg:rgba(79,159,224,.16)}
.score-level--fair{--rating:#ffd26c;--rating-bg:rgba(242,181,68,.17)}
.score-level--weak{--rating:#ffae7c;--rating-bg:rgba(242,139,82,.17)}
.score-level--poor{--rating:#ff91a0;--rating-bg:rgba(232,90,120,.18)}
.score-level--unknown{--rating:#b3c4d9;--rating-bg:rgba(169,187,209,.12)}
.score-summary{margin-top:12px;display:inline-flex;align-items:center;gap:10px;padding:10px 14px;
  min-width:182px;max-width:100%;border:1px solid color-mix(in srgb,var(--rating) 50%,transparent);
  border-radius:14px;background:var(--rating-bg)}
.score-summary .score-symbol{font-size:37px;font-weight:750;line-height:1;color:var(--rating);min-width:37px;text-align:center}
.score-copy{display:flex;flex-direction:column;line-height:1.35;gap:2px}
.score-copy .score-kicker{font-size:11px;color:var(--sub)}
.score-copy strong{font-size:16px;color:var(--text);font-weight:700}
.score-copy .score-num{font-size:12px;color:var(--rating);font-weight:700}
.score-mini{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:4px;
  border:1px solid color-mix(in srgb,var(--rating) 40%,transparent);background:var(--rating-bg);
  padding:2px 8px;border-radius:999px;color:var(--rating);font-size:12px;line-height:1.25;font-weight:700}
.score-mini .score-symbol{font-size:20px;line-height:1}
.day[aria-pressed="true"] .score-mini{background:rgba(6,18,42,.12);border-color:rgba(6,18,42,.2);color:#06122a}
.score-hour,.score-table{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;gap:1px;color:var(--rating)}
.score-hour .score-symbol,.score-table .score-symbol{font-size:17px;line-height:1;font-weight:800}
.score-hour .score-num{font-size:10px;font-weight:700}
.score-table .score-symbol{font-size:21px}
.score-table .score-num{font-size:12px}
.rating-guide{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0 14px;align-items:center}
.rating-guide-title{font-size:12px;color:var(--sub)}
.rating-key{display:inline-flex;gap:4px;align-items:center;font-size:12px;white-space:nowrap}
.rating-key .rating-mark{font-size:18px;font-weight:800;line-height:1;color:var(--rating)}
.rating-key .rating-range{color:var(--sub);font-size:11px}
.rating-explain{margin:0 0 10px;color:var(--sub);font-size:11px}
@media (max-width:760px){
  .score-summary{padding:9px 12px;margin-top:8px}
  .score-summary .score-symbol{font-size:32px;min-width:32px}
  .score-copy strong{font-size:15px}
  .rating-guide{gap:7px 12px}
  .rating-guide-title{width:100%}
  .day{min-height:111px}
}
@media (max-width:360px){.size{font-size:clamp(23px,6.6vw,28px)}.rating-guide{gap:6px 9px}}
</style>

// サーファーの呼び方。沖の波高から±15%の幅で表示(例: モモ〜コシ)
function sz(a){
  if(a == null) return '--'; if(a < 0.15) return 'フラット';
  const f = x => { for(const [n,lo,hi] of BANDS) if(x < hi) return n; return 'オーバーヘッド'; };
  const lo = f(a*0.85), hi = f(a*1.15); return lo === hi ? lo : lo + '〜' + hi;
}

// 総合評価: 予測スコア (0–100) から5段階へ。境界値は暫定値。
const RATING_LEVELS = [
  {min:85, mark:'◎', label:'最高', key:'excellent', range:'85〜100点'},
  {min:70, mark:'○', label:'良好', key:'good', range:'70〜84点'},
  {min:55, mark:'△', label:'まずまず', key:'fair', range:'55〜69点'},
  {min:40, mark:'▼', label:'今ひとつ', key:'weak', range:'40〜54点'},
  {min:0, mark:'×', label:'厳しい', key:'poor', range:'0〜39点'}
];
function rating(score){
  if(score == null || !Number.isFinite(Number(score))) return {mark:'—',label:'データなし',key:'unknown',range:''};
  const v = Math.min(100, Math.max(0, Number(score)));
  return RATING_LEVELS.find(x => v >= x.min);
}
function scoreBadge(score, display){
  const r = rating(score), n = score == null || !Number.isFinite(Number(score)) ? '--' : Math.round(Number(score));
  const tip = '総合予報スコア ' + n + '点：' + r.label;
  if(display === 'hero') return '<div class="score-summary score-level--' + r.key + '" aria-label="' + tip + '"><span class="score-symbol" aria-hidden="true">' + r.mark + '</span><div class="score-copy"><span class="score-kicker">総合予報スコア</span><strong>' + r.label + '</strong><span class="score-num">' + n + ' / 100点</span></div></div>';
  if(display === 'day') return '<span class="score-mini score-level--' + r.key + '" title="' + tip + '"><span class="score-symbol" aria-hidden="true">' + r.mark + '</span>' + n + '点</span>';
  const cls = display === 'table' ? 'score-table' : 'score-hour';
  return '<span class="' + cls + ' score-level--' + r.key + '" title="' + tip + '" aria-label="' + tip + '"><span class="score-symbol" aria-hidden="true">' + r.mark + '</span><span class="score-num">' + n + '</span></span>';
}
function scoreGuide(){
  return '<div class="rating-guide" aria-label="総合予報スコアの5段階評価"><span class="rating-guide-title">総合スコアの目安</span>' +
    RATING_LEVELS.map(r => '<span class="rating-key score-level--' + r.key + '"><b class="rating-mark">' + r.mark + '</b> ' + r.label + ' <span class="rating-range">' + r.range + '</span></span>').join('') +
    '</div><p class="rating-explain">※評価基準は試験運用中。波高・風による面・周期を組み合わせた簡易スコアです。</p>';
}
function dir16(d){ return d == null ? '--' : DIRS[Math.round((((d%360)+360)%360)/22.5)%16]; }
function fmt(v,n){ return v == null ? '--' : Number(v).toFixed(n); }
function jstNow(){ return new Date().toLocaleString('sv-SE', {timeZone:'Asia/Tokyo'}).slice(0,13).replace(' ','T') + ':00'; }
function hourOf(t){ return +t.slice(11,13); }
function dayLabel(d){ const [y,m,dd] = d.split('-').map(Number); return m + '/' + dd + '(' + '日月火水木金土'[new Date(Date.UTC(y,m-1,dd)).getUTCDay()] + ')'; }
function ramp(h){ const t = Math.min(1, Math.max(0, (h - 0.2)/1.4)), a = [43,108,176], b = [242,181,68]; return 'rgb(' + a.map((v,i) => Math.round(v + (b[i]-v)*t)).join(',') + ')'; }
// 面(水面の状態)。風の向きと強さから
function face(r){
  if(r.kind == null || r.spd == null) return '--'; const s = r.spd;
  return {off: s<=6?'◎':s<=9?'○':'△', sideoff: s<=5?'◎':s<=8?'○':'△', side: s<=4?'◎':s<=5?'○':s<=8?'△':'✕', sideon: s<=2?'○':s<=4?'△':'✕', on: s<=1.5?'○':s<=3?'△':'✕'}[r.kind];
}
function faceBg(f){ return f === '◎' ? 'rgba(59,143,224,.5)' : f === '○' ? 'rgba(59,143,224,.24)' : f === '△' ? 'rgba(242,181,68,.24)' : f === '✕' ? 'rgba(242,181,68,.45)' : 'transparent'; }
function windBg(k){ return k === 'off' || k === 'sideoff' ? 'rgba(59,143,224,.4)' : k === 'on' || k === 'sideon' ? 'rgba(242,181,68,.32)' : 'rgba(169,187,209,.14)'; }
function kindCls(k){ return k === 'off' || k === 'sideoff' ? 'off' : k === 'on' || k === 'sideon' ? 'on' : ''; }
let SUN = [5, 18], NOWT = '';
function isNight(r){ const h = hourOf(r.t) + .5; return h < SUN[0] || h > SUN[1]; }
function days(rows){ const m = {}; rows.forEach(r => (m[r.t.slice(0,10)] = m[r.t.slice(0,10)] || []).push(r)); return Object.keys(m).sort().map(d => ({date:d, rows:m[d]})); }
function daytime(rows){ return rows.filter(r => hourOf(r.t) >= 5 && hourOf(r.t) <= 18); }
function bestOf(rows){ return rows.reduce((b,r) => (r.score != null && (b == null || r.score > b.score)) ? r : b, null); }

// うねりと風の向きのコンパス。陸側を灰色、うねりは岸に届きやすいほど金色
function compass(r, p){
  const c = 120, R = 84, pt = (d,rad) => [c + rad*Math.sin(d*Math.PI/180), c - rad*Math.cos(d*Math.PI/180)];
  const [x1,y1] = pt(p.facing+90, R), [x2,y2] = pt(p.facing+270, R), [lx,ly] = pt(p.facing+180, 44);
  const arr = (d,w,col,len) => {
    const tip = R - len, base = tip + w*2.4, [ax,ay] = pt(d,R), [bx,by] = pt(d,base), [tx,ty] = pt(d,tip), ux = Math.cos(d*Math.PI/180), uy = Math.sin(d*Math.PI/180), k = w*1.4;
    return '<line x1="' + ax + '" y1="' + ay + '" x2="' + bx + '" y2="' + by + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/><polygon points="' + tx + ',' + ty + ' ' + (bx+ux*k) + ',' + (by+uy*k) + ' ' + (bx-ux*k) + ',' + (by-uy*k) + '" fill="' + col + '"/>';
  };
  let s = '<svg viewBox="0 0 240 240" role="img" aria-label="うねりと風の向き"><circle cx="120" cy="120" r="84" fill="rgba(59,143,224,.16)" stroke="rgba(233,241,250,.3)"/><path d="M' + x1 + ' ' + y1 + 'A84 84 0 0 1 ' + x2 + ' ' + y2 + 'Z" fill="rgba(169,187,209,.3)"/>' +
    '<text x="120" y="14" text-anchor="middle" font-size="12" fill="#A9BBD1">北</text><text x="' + lx + '" y="' + (ly+4) + '" text-anchor="middle" font-size="12" fill="#E9F1FA">陸</text>';
  (r.comps || []).filter(m => m[0] >= 0.05 && m[2] != null).forEach(m => {
    const col = m[3]/m[0] >= 0.6 ? '#F2B544' : '#7F93AD', [tx,ty] = pt(m[2], R+17);
    s += arr(m[2], 2 + m[0]*7, col, 26 + Math.min(m[0],1.5)*34) + '<text x="' + tx + '" y="' + (ty+4) + '" text-anchor="middle" font-size="11" fill="' + col + '">' + fmt(m[0],1) + 'm</text>';
  });
  if(r.dir != null) s += arr(r.dir, 2, '#E9F1FA', 24);
  return s + '</svg><div class="legend"><span><i style="background:#F2B544"></i>岸に届くうねり</span><span><i style="background:#7F93AD"></i>届きにくいうねり</span><span><i style="background:#E9F1FA"></i>風</span></div>';
}
// 1日の波のグラフ(縦軸はスネ〜アタマ)と潮位
function chart(rows, now){
  const W = 1016, L = 56, cw = 40, H = 210, top = 18, tt = 244, th = 44;
  const mx = Math.max(2, Math.max(...rows.map(r => r.a || 0))*1.1), y = v => top + H - v/mx*H;

    if(lo >= mx) return; const hi = Math.min(u, mx);
    s += '<line x1="' + L + '" x2="' + W + '" y1="' + y(hi) + '" y2="' + y(hi) + '" stroke="rgba(233,241,250,.12)"/><text x="' + (L-8) + '" y="' + (y((lo+hi)/2)+4) + '" text-anchor="end" font-size="12" fill="#A9BBD1">' + n + '</text>'; lo = u;
  });
  rows.forEach((r,i) => {

    s += '<rect x="' + (L+i*cw+4) + '" y="' + (top+H-hh) + '" width="' + (cw-8) + '" height="' + hh + '" rx="4" fill="' + ramp(r.a || 0) + '" opacity="' + (night || r.t < now ? .4 : 1) + '"/>';
  });
  const best = bestOf(daytime(rows)), bi = best ? rows.indexOf(best) : -1;
  if(bi >= 0){ const x0 = L + Math.max(0, bi-1)*cw + 1; s += '<rect x="' + x0 + '" y="' + (top-4) + '" width="' + (cw*3-2) + '" height="' + (H+8) + '" rx="10" fill="none" stroke="#F2B544" stroke-width="2"/><text x="' + (x0+cw*1.5) + '" y="11" text-anchor="middle" font-size="12" fill="#F2B544">おすすめ</text>'; }
  const ni = rows.findIndex(r => r.t === now);
  if(ni >= 0) s += '<line x1="' + (L+(ni+.5)*cw) + '" x2="' + (L+(ni+.5)*cw) + '" y1="' + top + '" y2="' + (tt+th) + '" stroke="#E9F1FA" stroke-dasharray="3 4" opacity=".6"/>';
  const tv = rows.map(r => r.tide).filter(v => v != null);
  s += '<text x="' + (L-8) + '" y="' + (tt+th/2+4) + '" text-anchor="end" font-size="12" fill="#A9BBD1">潮位</text>';
  if(tv.length){ const a = Math.min(...tv), b = Math.max(...tv), ty = v => tt + th - (v-a)/((b-a)||1)*th; s += '<polyline points="' + rows.map((r,i) => r.tide == null ? null : (L+(i+.5)*cw) + ',' + ty(r.tide)).filter(Boolean).join(' ') + '" fill="none" stroke="#3B8FE0" stroke-width="2.5"/>'; }

}
function arrow(deg){ return deg == null ? '--' : '<i style="transform:rotate(' + ((deg+180)%360) + 'deg)">↑</i>'; }
function cells(rows){
  const row = (label, fn) => '<div class="cl">' + label + '</div>' + rows.map(r => { const f = fn(r); return '<div class="c' + (isNight(r) ? ' night' : '') + '"' + f[0] + '>' + f[1] + '</div>'; }).join('');
  return '<div class="grid">' + row('時刻', r => ['', hourOf(r.t)]) + row('風', r => [' style="background:' + windBg(r.kind) + '" title="' + dir16(r.dir) + ' ' + (r.kind ? KIND[r.kind] : '') + '"', arrow(r.dir) + fmt(r.spd,0)]) +
    row('面', r => [' style="background:rgba(59,143,224,' + (.08 + .62*(r.q || 0)).toFixed(2) + ')" title="風の履歴を考えた水面の良さ"', '']) +
    row('周期', r => ['', fmt(r.per,0) + '秒']) + row('波向', r => [' title="' + dir16(r.wdir) + '"', arrow(r.wdir)]) +
    row('総合評価', r => ['', scoreBadge(r.score, 'hour')]) + '</div>';
}

// 日の出・日の入り(JSTの時刻)。NOAAの近似式
function sun(date, lat, lon){
  const [y,m,d] = date.split('-').map(Number), n = Math.floor((Date.UTC(y,m-1,d) - Date.UTC(y,0,0))/864e5), g = 2*Math.PI/365*(n-1), R = Math.PI/180;
  const eq = 229.18*(0.000075 + 0.001868*Math.cos(g) - 0.032077*Math.sin(g) - 0.014615*Math.cos(2*g) - 0.040849*Math.sin(2*g));
  const dc = 0.006918 - 0.399912*Math.cos(g) + 0.070257*Math.sin(g) - 0.006758*Math.cos(2*g) + 0.000907*Math.sin(2*g) - 0.002697*Math.cos(3*g) + 0.00148*Math.sin(3*g);
  const ha = Math.acos(Math.cos(90.833*R)/(Math.cos(lat*R)*Math.cos(dc)) - Math.tan(lat*R)*Math.tan(dc))/R;
  return [(720 - 4*(lon + ha) - eq)/60 + 9, (720 - 4*(lon - ha) - eq)/60 + 9];
}
function hm(h){ return Math.floor(h) + ':' + String(Math.round((h%1)*60)).padStart(2,'0'); }
// 潮位のグラフ(満潮・干潮の印と、夜の網掛け)
function tideChart(rows, now){
  const v = rows.map(r => r.tide);
  if(v.some(x => x == null)) return '<p class="msg">潮位のデータがありません</p>';
  const W = 1016, L = 56, cw = 40, H = 120, top = 18, a = Math.min(...v), b = Math.max(...v), y = x => top + H - (x-a)/((b-a)||1)*H, X = i => L + (i+.5)*cw;
  let s = '<svg viewBox="0 0 ' + W + ' ' + (H+top+26) + '" role="img" aria-label="潮位のグラフ">';
  rows.forEach((r,i) => { if(isNight(r)) s += '<rect x="' + (L+i*cw) + '" y="' + top + '" width="' + cw + '" height="' + H + '" fill="rgba(169,187,209,.14)"/>'; });
  s += '<path d="M' + X(0) + ' ' + (top+H) + rows.map((r,i) => 'L' + X(i) + ' ' + y(r.tide)).join('') + 'L' + X(rows.length-1) + ' ' + (top+H) + 'Z" fill="rgba(59,143,224,.28)"/><polyline points="' + rows.map((r,i) => X(i) + ',' + y(r.tide)).join(' ') + '" fill="none" stroke="#3B8FE0" stroke-width="2.5"/>';
  rows.forEach((r,i) => { const p = v[i-1], n = v[i+1]; if(i > 0 && i < v.length-1 && ((v[i] > p && v[i] >= n) || (v[i] < p && v[i] <= n))){ const hi = v[i] > p;
    s += '<circle cx="' + X(i) + '" cy="' + y(v[i]) + '" r="4" fill="#F2B544"/><text x="' + X(i) + '" y="' + (hi ? y(v[i]) - 9 : y(v[i]) + 19) + '" text-anchor="middle" font-size="12" fill="#E9F1FA">' + (hi ? '満潮 ' : '干潮 ') + hourOf(r.t) + '時 ' + (v[i] >= 0 ? '+' : '') + Math.round(v[i]*100) + 'cm</text>'; } });
  for(let h = 0; h < 24; h += 3) s += '<text x="' + (L+h*cw) + '" y="' + (top+H+18) + '" font-size="12" fill="#A9BBD1" text-anchor="middle">' + h + '時</text>';
  const ni = rows.findIndex(r => r.t === now);
  if(ni >= 0) s += '<line x1="' + X(ni) + '" x2="' + X(ni) + '" y1="' + top + '" y2="' + (top+H) + '" stroke="#E9F1FA" stroke-dasharray="3 4" opacity=".6"/>';
  return s + '</svg><p class="note">潮位は平均海面からの高さ(モデル値)。灰色の時間帯は日没後です(日の出 ' + hm(SUN[0]) + '、日の入り ' + hm(SUN[1]) + ')。</p>';
}
const WX = c => c == null ? '' : c === 0 ? '☀' : c <= 2 ? '🌤' : c === 3 ? '☁' : c <= 48 ? '🌫' : c <= 67 ? '🌧' : c <= 77 ? '❄' : c <= 82 ? '🌦' : '⛈';
// Surf life のような、2時間ごとの詳細表
function table(rows){
  const w = (m, heat) => !m || m[0] == null ? '<td>--</td>' : '<td' + (heat ? ' style="background:' + ramp(m[0]).replace('rgb','rgba').replace(')',',.35)') + '"' : '') + '>' + fmt(m[0],1) + 'm / ' + fmt(m[1],0) + 's <small>' + dir16(m[2]) + '</small></td>';
  return '<div class="tbw"><table class="tb"><tr><th>時間</th><th>総合評価</th><th>天気</th><th>気温</th><th>潮位</th><th>海水温</th><th>風</th><th>波高</th><th>風波</th><th>うねり</th><th>うねり2</th></tr>' +
    rows.filter(r => hourOf(r.t) % 2 === 0 && r.t >= NOWT).map(r => '<tr' + (isNight(r) ? ' class="nt"' : '') + '><td>' + hourOf(r.t) + '</td><td>' + scoreBadge(r.score, 'table') + '</td><td>' + WX(r.wx) + '</td><td>' + (r.tmp == null ? '--' : Math.round(r.tmp) + '℃') + '</td><td>' + (r.tide == null ? '--' : Math.round(r.tide*100) + 'cm') + '</td><td>' + fmt(r.sst,1) + '℃</td>' +
      '<td style="background:' + windBg(r.kind) + '">' + fmt(r.spd,1) + 'm/s <small>' + dir16(r.dir) + ' ' + (r.kind ? KIND[r.kind] : '') + '</small></td>' + w(r.wv, true) + w(r.ww) + w(r.sw) + w(r.sw2) + '</tr>').join('') + '</table></div>';
}
function spark(dt, mx, sel){
  const w = 7, g = 2;
  return '<svg class="spark" viewBox="0 0 ' + (dt.length*(w+g)) + ' 28" preserveAspectRatio="none">' + dt.map((x,i) => { const h = Math.max(1, (x.a || 0)/mx*26); return '<rect x="' + i*(w+g) + '" y="' + (28-h) + '" width="' + w + '" height="' + h + '" rx="1.5" fill="' + (sel ? '#06122A' : ramp(x.a || 0)) + '"/>'; }).join('') + '</svg>';
}

function view(p, rows){
  const now = jstNow(); let ni = rows.findIndex(r => r.t >= now); if(ni < 0) ni = 0;
  NOWT = now;
  const ds = days(rows).filter(d => d.date >= now.slice(0,10));
  if(!ds.length) return '<div class="wrap"><p class="msg">予想データが古くなっています。start.sh で予想を更新してください。</p></div>|SPLIT|';
  const r = rows[ni], di = Math.min(state.day, ds.length - 1); SUN = sun(ds[di].date, p.lat, p.lon);
  const tide = r.tide == null ? '--' : Math.round(r.tide*100) + 'cm ' + (r.tideNext != null && r.tideNext > r.tide ? '上げ' : '下げ');
  const wk = Math.max(0.5, ...rows.filter(x => hourOf(x.t) >= 5 && hourOf(x.t) <= 18).map(x => x.a || 0));
  const week = ds.map((d,i) => { const dt = daytime(d.rows), mx = dt.reduce((m,x) => x.a != null && x.a > m ? x.a : m, 0), b = bestOf(dt);
    return '<button class="day" data-day="' + i + '" aria-pressed="' + (i === di) + '"><span>' + dayLabel(d.date) + '</span><b>' + sz(mx) + '</b>' + (b ? scoreBadge(b.score, 'day') : '') + spark(dt, wk, i === di) + '<span>' + (b ? 'おすすめ ' + hourOf(b.t) + '時' : '') + '</span></button>'; }).join('');
  return '<div class="wrap"><section class="now"><div><p class="lead">いまの' + p.name + '</p><div class="big"><p class="size">' + sz(r.a) + '</p></div>' + scoreBadge(r.score, 'hero') +
    '<dl class="stats"><div><dt>岸の波高</dt><dd>' + fmt(r.a,1) + 'm</dd></div><div><dt>沖の波高</dt><dd>' + fmt(r.h,1) + 'm</dd></div><div><dt>周期</dt><dd>' + fmt(r.per,0) + '秒</dd></div>' +
    '<div><dt>風</dt><dd>' + fmt(r.spd,1) + 'm/s' + (r.kind ? '<span class="kind ' + kindCls(r.kind) + '">' + KIND[r.kind] + '</span>' : '') + '</dd></div><div><dt>潮位</dt><dd>' + tide + '</dd></div><div><dt>水温</dt><dd>' + fmt(r.sst,1) + '℃</dd></div></dl></div>' +
    '<div class="compass">' + compass(r, p) + '</div></section></div>|SPLIT|' +
    '<div class="wrap"><h2>1週間の見通し</h2>' + scoreGuide() + '<div class="week">' + week + '</div><h2>' + dayLabel(ds[di].date) + ' の波<small class="n">「面」の青い帯は、風の向きと強さの履歴から見た水面の良さ(濃いほど良い)</small></h2><div class="panel"><p class="scroll-hint">← 表を横にスワイプして時間帯を確認 →</p><div class="chart">' + chart(ds[di].rows, now) + cells(ds[di].rows) + '</div></div>' +
    '<h2>潮位</h2><div class="panel">' + tideChart(ds[di].rows, now) + '</div><h2>時間ごとの詳細(2時間ごと)</h2><div class="panel">' + table(ds[di].rows) + '</div>' +
    '<h2>天気・実測を見る(気象庁・国土交通省のサイトへ)</h2><div class="links">' + LINKS.map(l => '<a href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + '</a>').join('') + '</div></div>';
}

function select(i){ state.pi = i; state.day = 0; render(); }
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.point != null) select(+t.dataset.point);
  else if(t.dataset.day != null){ state.day = +t.dataset.day; render(); }
});
async function init(){
  try{
    const j = await (await fetch('data/forecast.json', {cache:'no-cache'})).json();
    POINTS = j.points.map(p => ({id:p.id, name:p.name, facing:p.facing, lat:p.lat, lon:p.lon}));
    j.points.forEach(p => state.data[p.id] = p.rows);
    state.at = (j.generated_at || '').slice(11,16); state.gen = j.generated_at || '';
    select(0);
  }catch(e){ POINTS = [{id:'x', name:'—', facing:0}]; state.err = 'forecast.json を読み込めませんでした(' + e.message + ')'; render(); }
}
init();
